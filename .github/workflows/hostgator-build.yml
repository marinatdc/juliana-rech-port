name: Prepare HostGator site package

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostgator-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production site for julianarech.com.br
        run: npm run build:production

      - name: Validate generated SEO output
        run: npm run test:seo

      - name: Upload HostGator package
        uses: actions/upload-artifact@v6
        with:
          name: juliana-rech-hostgator
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
